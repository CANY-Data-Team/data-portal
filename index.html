<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Data Portal</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="search-page">

  <!-- =====================================================
       PAGE HEADER
  ====================================================== -->

  <header class="catalog-hero">

    <div class="catalog-hero-inner">

      <h1>Data and documentation for download</h1>

    </div>

  </header>

  <!-- =====================================================
       SEARCH
  ====================================================== -->

  <div class="search-container">

    <label for="search" class="search-label">
      Search datasets
    </label>

    <input
      id="search"
      type="search"
      placeholder="Search datasets..."
      autocomplete="off"
    />

  </div>

  <!-- =====================================================
       CATALOG CONTENT
  ====================================================== -->

  <div class="layout">

    <!-- Left sidebar -->

    <aside class="sidebar">

      <h3>Agencies</h3>

      <div id="agencyFilters"></div>

      <h3>Tags</h3>

      <div id="tagFilters"></div>

      <p>
        <a
          href="#"
          id="clear-all"
          class="nav-link"
        >
          Clear all filters
        </a>
      </p>

    </aside>

    <!-- Dataset results -->

    <main>

      <h2>Available Datasets</h2>

      <div
        id="resultsMeta"
        aria-live="polite"
      ></div>

      <div id="datasetList"></div>

    </main>

  </div>

  <script src="app.js"></script>

</body>
</html>
